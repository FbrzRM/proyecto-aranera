services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 1h
      MONGODB_URI: mongodb://db:27017/araneda
    depends_on:
      - db

  db:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - araneda_db:/data/db

volumes:
  araneda_db:
